      }
      .accent {

      }

      .text-muted {

      .bg-card {
        background: var(--card);
      }
      .bg-card-soft {
        background: var(--card-soft);
      }
      .pill {
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 11px;
        font-weight: 500;
      }

        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      .scanline::before {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.02) 0px,
          rgba(255, 255, 255, 0.02) 1px,
          transparent 1px,
          transparent 3px
        );
        pointer-events: none;
      }
      .vhs-flicker {
        animation: vhs 3.5s infinite;
      }
      @keyframes vhs {
        0%,
        96%,
        100% {
          opacity: 1;
        }
        97% {
          opacity: 0.6;
        }
        98% {
          opacity: 0.9;
        }
        99% {
          opacity: 0.4;
        }
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.04) 0%,
          rgba(255, 255, 255, 0.08) 50%,
          rgba(255, 255, 255, 0.04) 100%
        );
        background-size: 200% 100%;
        animation: shimmer 1.8s infinite;
        border-radius: 4px;
      }
      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

        border: 2px solid var(--neon);
        color: var(--neon);

        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.18em;
        transform: rotate(-2deg);

        background: #2a2a32;
        height: 10px;
        border-radius: 2px;
      }
      .nav-toggle {

        top: 14px;
        right: 14px;
        z-index: 100;
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 14px;
        font-size: 12px;
        cursor: pointer;
        border-radius: 6px;
        font-family: 'JetBrains Mono', monospace;
      }
      .nav-toggle:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .nav-panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 280px;
        background: var(--bg-soft);
        border-left: 1px solid var(--border);
        padding: 16px;
        overflow-y: auto;
        transform: translateX(100%);
        transition: transform 0.2s;
        z-index: 99;
      }
      .nav-panel.open {
        transform: translateX(0);
      }
      .nav-panel h4 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--muted);
        margin: 18px 0 8px;
      }
      .nav-panel a {
        display: block;
        padding: 8px 10px;
        font-size: 13px;
        color: var(--text);
        text-decoration: none;
        border-radius: 4px;
        margin-bottom: 2px;
      }
      .nav-panel a:hover {
        background: var(--card);
        color: var(--accent);
      }
      .nav-panel a.active {
        background: var(--card);
        color: var(--accent);
        border-left: 2px solid var(--accent);
      }
      .nav-panel .badge {
        font-size: 9px;
        padding: 1px 5px;
        margin-left: 6px;
        border-radius: 3px;

        background: rgba(34, 197, 94, 0.18);
        color: #86efac;
      }
      .badge-miss {
        background: rgba(236, 72, 153, 0.18);
        color: #f9a8d4;
      }
      .input-base {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 13px;
        outline: none;
      }
      .input-base:focus {
        border-color: var(--accent);
      }
      .btn-primary {
        background: var(--accent);
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .btn-primary:hover {
        background: var(--accent-soft);
      }
      .btn-ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
      }
      .btn-ghost:hover {

      }
      .vs-bar {
        height: 8px;
        background: linear-gradient(

        font-weight: 700;

        cursor: pointer;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }
      .rank-medal {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 12px;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--card);
        border: 1px solid var(--accent);
        padding: 10px 18px;
        border-radius: 6px;
        font-size: 13px;
        z-index: 200;
        animation: fadein 0.2s;
      }
      @keyframes fadein {
        from {
          opacity: 0;
          transform: translate(-50%, 10px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }

                <div class="rounded-b-lg border-x border-b border-default bg-card-soft p-5 -mt-1">
                  <p class="text-sm text-muted">${s.body}</p>
                  <button class="btn-primary mt-4 text-xs" onclick="${i === steps.length - 1 ? `go('/nickname')` : `toast('다음 단계')`}">${s.cta} →</button>
                </div>
              </details>`).join('')}
            <div class="text-center mt-6">
              <button class="text-xs text-muted hover:text-white" onclick="go('/home')">건너뛰기 (그래도 우린 잊혀집니다)</button>
            </div>
          </div>
        </div>`;
      }

      window.addEventListener('hashchange', renderApp);
      window.addEventListener('DOMContentLoaded', renderApp);
      // immediate first render
      renderApp();
    </script>
  </body>
</html>
