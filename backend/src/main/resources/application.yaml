server:
  # 신뢰 프록시 뒤에서만 X-Forwarded-* 해석 (직접 연결 시 무시) — getRemoteAddr가 진짜 클라 IP 반환
  forward-headers-strategy: framework

spring:
  application:
    name: community
  docker:
    compose:
      file: backend/compose.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/community
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

report:
  hide-threshold: 5
  ban-threshold: 5

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
